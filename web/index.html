<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Book Slipcase</title>
    <style>
        html, body { margin: 0; overflow: hidden; width: 100%; height: 100%; }
        canvas { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <canvas id="the_canvas_id"></canvas>
    <script src="./book_slipcase.js"></script>
    <script>
        wasm_bindgen('./book_slipcase_bg.wasm')
            .then(() => {
                const handle = new wasm_bindgen.WebHandle();
                const canvas = document.getElementById('the_canvas_id');
                return wasm_bindgen.start(handle, canvas);
            })
            .catch(console.error);
    </script>
</body>
</html>
