name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: book-slipcase

      - name: Clone vsvg dependency
        run: git clone --depth 1 https://github.com/abey79/vsvg.git vsvg

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: book-slipcase

      - uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: '0.2.100'

      - name: Build WASM
        working-directory: book-slipcase
        run: cargo build --lib --target wasm32-unknown-unknown --release

      - name: Generate JS bindings
        working-directory: book-slipcase
        run: |
          wasm-bindgen target/wasm32-unknown-unknown/release/book_slipcase.wasm \
            --out-dir web \
            --out-name book_slipcase \
            --no-modules \
            --no-typescript

      - name: Optimize WASM
        uses: NiklasEi/wasm-opt-action@v2
        with:
          file: book-slipcase/web/book_slipcase_bg.wasm

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: book-slipcase/web

      - id: deployment
        uses: actions/deploy-pages@v4
